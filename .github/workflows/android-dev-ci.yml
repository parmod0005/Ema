name: VARDHANI Development Android CI

on:
  push:
    branches: [develop/ema-android-foundation]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify debug APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee vardhani-dev-apk.sha256
          stat -c '%s' app/build/outputs/apk/debug/app-debug.apk | tee vardhani-dev-apk.size
      - name: Upload debug APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: vardhani-latest-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            vardhani-dev-apk.sha256
            vardhani-dev-apk.size
          if-no-files-found: error
          retention-days: 1
      - name: Publish APK artifact id
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"vardhani-dev-apk:$ARTIFACT_ID\",\"description\":\"Development APK built and verified\"}"
