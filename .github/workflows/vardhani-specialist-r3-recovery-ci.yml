name: VARDHANI Specialist R3 Recovery CI

on:
  push:
    branches:
      - research/vardhani-specialist-r3-corpus-recovery
    paths:
      - 'research/vardhani_specialist_r3/**'
      - '.github/workflows/vardhani-specialist-r3-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner reached executable steps
        run: echo "VARDHANI R3 recovery CI runner active"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic recovery dependencies
        run: python -m pip install -r research/vardhani_specialist_r3/requirements-r3-recovery.txt
      - name: Compile recovery and V2 teacher-gate tools
        run: |
          python -m py_compile \
            research/vardhani_specialist_r3/rebuild_aiml_option_corpus.py \
            research/vardhani_specialist_r3/build_r3_option_split.py \
            research/vardhani_specialist_r3/verify_corpus_recovery.py \
            research/vardhani_specialist_r3/verify_corpus_recovery_v2.py \
            research/vardhani_specialist_r3/run_exact_recovery_gate.py \
            research/vardhani_specialist_r3/build_full_market_corpus.py \
            research/vardhani_specialist_r3/build_full_market_corpus_v2.py \
            research/vardhani_specialist_r3/verify_teacher_preflight.py \
            research/vardhani_specialist_r3/verify_teacher_preflight_v2.py \
            research/vardhani_specialist_r3/verify_teacher_preflight_v2_strict.py \
            research/vardhani_specialist_r3/recover_v02_architecture_package.py
      - name: Run all recovery contract tests
        env:
          PYTHONPATH: research/vardhani_specialist_r3
        run: python -m unittest discover -s research/vardhani_specialist_r3 -p 'test_*.py' -v
