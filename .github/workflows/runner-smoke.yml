name: Runner Smoke

on:
  push:
    branches: [build/windows-apk-fallback]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Runner reached first step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "RUNNER_SMOKE_REACHED"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"runner-smoke:$RUN_ID\",\"description\":\"Hosted runner reached step 1\"}"
