name: VARDHANI Self-Hosted Android Rescue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-self-hosted-rescue.yml'
      - '.github/VARDHANI_SELF_HOSTED_TRIGGER'

permissions:
  contents: read
  statuses: write

concurrency:
  group: vardhani-self-hosted-android
  cancel-in-progress: true

jobs:
  build-current-apk:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Verify Windows self-hosted runner
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          if ($env:RUNNER_OS -ne 'Windows') {
            throw 'VARDHANI rescue build requires a Windows self-hosted runner.'
          }

      - name: Checkout current VARDHANI development source
        uses: actions/checkout@v4
        with:
          ref: develop/ema-android-foundation
          fetch-depth: 1

      - name: Capture exact development SHA
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building exact VARDHANI SHA $sha"

      - name: Publish build start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = 'pending'
            context = "vardhani-self-hosted:$env:RUN_ID"
            description = 'Self-hosted VARDHANI Android build started'
            target_url = "https://github.com/$env:REPO/actions/runs/$env:RUN_ID"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" -Body $body -ContentType 'application/json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android API 35 toolchain
        shell: pwsh
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          sdkmanager --list_installed

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Print toolchain versions
        shell: pwsh
        run: |
          java -version
          gradle --version
          sdkmanager --version
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

      - name: Run Android unit tests
        shell: pwsh
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble current debug APK
        shell: pwsh
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK payload and fingerprint
        id: verify
        shell: pwsh
        run: |
          $apk = 'app/build/outputs/apk/debug/app-debug.apk'
          if (!(Test-Path $apk -PathType Leaf)) { throw "APK missing: $apk" }
          $item = Get-Item $apk
          if ($item.Length -le 0) { throw 'APK is empty.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $dex = $zip.Entries | Where-Object { $_.FullName -eq 'classes.dex' }
            if (-not $dex) { throw 'classes.dex is missing from APK.' }
          } finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $item.Length
          $sha = '${{ steps.source.outputs.sha }}'
          $short = '${{ steps.source.outputs.short }}'
          $final = "VARDHANI_FULL_$short.apk"
          Copy-Item $apk $final -Force
          "$hash  $final" | Set-Content 'vardhani-apk.sha256' -Encoding ascii
          "$size" | Set-Content 'vardhani-apk.size' -Encoding ascii
          "source_sha=$sha" | Set-Content 'vardhani-build-info.txt' -Encoding ascii
          "sha256=$hash" | Add-Content 'vardhani-build-info.txt' -Encoding ascii
          "size=$size" | Add-Content 'vardhani-build-info.txt' -Encoding ascii
          "apk=$final" | Add-Content 'vardhani-build-info.txt' -Encoding ascii

          "apk_name=$final" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VERIFIED APK: $final"
          Write-Host "SHA256: $hash"
          Write-Host "SIZE: $size bytes"

      - name: Upload certified VARDHANI APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: VARDHANI-current-${{ steps.source.outputs.short }}
          path: |
            ${{ steps.verify.outputs.apk_name }}
            vardhani-apk.sha256
            vardhani-apk.size
            vardhani-build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish certified APK status
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = 'success'
            context = "vardhani-apk:$env:ARTIFACT_ID"
            description = 'Current VARDHANI APK built, classes.dex verified and fingerprinted'
            target_url = "https://github.com/$env:REPO/actions/runs/$env:RUN_ID"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" -Body $body -ContentType 'application/json'

      - name: Publish build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SHA)) { exit 0 }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = 'failure'
            context = "vardhani-self-hosted:$env:RUN_ID"
            description = 'Self-hosted VARDHANI Android build failed'
            target_url = "https://github.com/$env:REPO/actions/runs/$env:RUN_ID"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" -Body $body -ContentType 'application/json'
          } catch {
            Write-Warning $_
          }
