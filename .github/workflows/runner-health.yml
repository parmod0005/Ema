name: GitHub Runner Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-health.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner reached step one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "GITHUB_RUNNER_HEALTH_REACHED"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"runner-health:$RUN_ID\",\"description\":\"GitHub hosted runner reached step 1\"}"
