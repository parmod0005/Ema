name: GitHub Runner Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-health.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  linux-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove ubuntu-slim reached step one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "GITHUB_UBUNTU_SLIM_REACHED"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"runner-health-linux:$RUN_ID\",\"description\":\"ubuntu-slim reached step 1\"}"

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Prove windows-latest reached step one
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          Write-Host "GITHUB_WINDOWS_REACHED"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "success"
            context = "runner-health-windows:$env:RUN_ID"
            description = "windows-latest reached step 1"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" -Body $body -ContentType "application/json"
