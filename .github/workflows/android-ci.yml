name: VARDHANI Trusted Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vardhani-trusted-build
  cancel-in-progress: true

jobs:
  build-full-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout VARDHANI development source
        uses: actions/checkout@v4
        with:
          ref: develop/ema-android-foundation
          fetch-depth: 1

      - name: Capture development SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish build start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"vardhani-build:$RUN_ID\",\"description\":\"Trusted main build started\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        id: tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        id: assemble
        run: gradle assembleDebug --stacktrace

      - name: Verify APK payload
        id: verify
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee vardhani-apk.sha256
          stat -c '%s' app/build/outputs/apk/debug/app-debug.apk | tee vardhani-apk.size

      - name: Upload full VARDHANI APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: VARDHANI-1.0.0-full
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            vardhani-apk.sha256
            vardhani-apk.size
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK artifact id
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"vardhani-apk:$ARTIFACT_ID\",\"description\":\"Full APK built and verified\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}"

      - name: Publish build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"failure\",\"context\":\"vardhani-build:$RUN_ID\",\"description\":\"Trusted Android build failed\",\"target_url\":\"https://github.com/$REPO/actions/runs/$RUN_ID\"}" || true
