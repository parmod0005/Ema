name: Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: bridge
      - run: pytest -q
        working-directory: bridge
        env:
          PYTHONPATH: .
      - run: docker build -f bridge/Dockerfile -t vardhani-bridge:test .
