name: VARDHANI Trusted Android Build

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vardhani-trusted-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'develop/ema-android-foundation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout guarded PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: vardhani-current-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Publish artifact id to PR head
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" \
            -d "{\"state\":\"success\",\"context\":\"vardhani-trusted-apk:$ARTIFACT_ID\",\"description\":\"Trusted VARDHANI APK built\"}"
